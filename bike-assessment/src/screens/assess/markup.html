          <div class="appbar__titles">
            <p class="t-label-md"><span data-bike-id>543210</span><span class="appbar__suffix" aria-hidden="true">&nbsp;/ Assessment Checklist</span></p>

        <button class="icon-btn appbar__more" id="assessMore" data-opt-more aria-label="More options"

        </button>
      </div>
    </header>

    <main class="scroll" id="scroll">
      <!-- The large heading is gone. The tab strip above the list already says
           Assessment, and the app bar carries the breadcrumb permanently now
           that there is no heading to hand it over from — three places naming
           one screen was two too many. The element stays as an empty spacer so
           the list keeps its 24px lead-in and the scroll hand-off below has
           something to measure; see syncListHeading. -->
      <div class="listhead" id="listhead"></div>
      <div class="list" id="list"></div>
    </main>

    <div class="progress"><div class="progress__fill" id="progressFill"></div></div>

    <!-- Assessment / Penalties. Filled and switched by paintStepTabs — see
         shared/steptabs.js, which also carries why these two are tabs across two
         screens rather than panels of one. -->
    <nav class="steptabs" id="assessTabs" role="tablist" aria-label="Assessment"></nav>

    <footer class="footer" id="assessFooter">
      <!-- Filled by stepBannerHTML() and shown by paintStepBanner() — see
           shared/stepbanner.js. Rides above the footer rather than inside its
           padding, so it is full-bleed wherever the footer happens to be. -->
      <div class="stepbanner" id="assessBanner" hidden></div>
      <button class="btn-primary t-label-md700" id="nextBtn">Mark penalty</button>
    </footer>

  </section>
