  <!-- ══════════════════════════════════════════════════════════════════════
       TIME DETAILS — the whole clock on one repair
       ══════════════════════════════════════════════════════════════════════
       The footer of a finished bike shows one figure, Time spent, because that
       is the one a Sr. Mechanic scanning a board wants. Everything else about
       the clock — when it was handed over, when the mechanic actually started,
       when they closed it, and the two gaps between — lives here, a chevron
       away, rather than crowding a band built for one number.

       EVERY FIGURE ON THIS PAGE IS INVENTED. The app times nothing: the handover
       moment is stored per bike and the other two are derived from it, so the
       page cannot contradict itself, but none of the three is measured. See
       allocAt in shared/fleets.js — that is the one to replace.
       ══════════════════════════════════════════════════════════════════════ -->
  <section class="screen screen--alloctime" id="scrAllocTime" data-pos="right" aria-label="Time details">

    <header class="appbar">
      <div class="appbar__row">
        <div class="appbar__lhs">
          <div class="leading-action">
            <button class="icon-btn" id="atBack" aria-label="Back">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M10.4538 12L14.5269 16.0731C14.6654 16.2116 14.7362 16.3856 14.7394 16.5952C14.7426 16.8048 14.6718 16.982 14.5269 17.1269C14.382 17.2718 14.2064 17.3442 14 17.3442C13.7936 17.3442 13.618 17.2718 13.4731 17.1269L8.97888 12.6327C8.88528 12.5391 8.81925 12.4404 8.7808 12.3365C8.74233 12.2327 8.7231 12.1205 8.7231 12C8.7231 11.8795 8.74233 11.7673 8.7808 11.6635C8.81925 11.5596 8.88528 11.4609 8.97888 11.3673L13.4731 6.8731C13.6116 6.73463 13.7856 6.6638 13.9952 6.6606C14.2048 6.65738 14.382 6.72822 14.5269 6.8731C14.6718 7.01797 14.7442 7.1936 14.7442 7.4C14.7442 7.6064 14.6718 7.78203 14.5269 7.9269L10.4538 12Z" fill="#222222"/></svg>
            </button>
          </div>
          <div class="appbar__titles">
            <p class="t-label-md"><span id="atCrumb">543210</span><span class="appbar__suffix" aria-hidden="true">&nbsp;/ Time details</span></p>
          </div>
        </div>
      </div>
    </header>

    <!-- The same banner the page behind it carries, so the two read as one
         place: who has the bike, and what state it is in. -->
    <div class="al-head">
      <span class="al-head__f" id="atFace" aria-hidden="true"></span>
      <div class="al-head__t">
        <h2 class="t-title-page" id="atTitle">Ramesh K.</h2>
        <p class="t-label-md al-sub" id="atSub">Finished</p>
      </div>
    </div>

    <main class="atscroll" id="atScroll">
      <!-- THE MOMENTS, then the GAPS between them. Both, and in that order: a
           clock time answers "when did this happen" and a duration answers "how
           long did it take", and a page that gave only one of the two would
           send somebody back to do arithmetic. -->
      <h3 class="at-sec t-label-md700">Timeline</h3>
      <div class="at-rows" id="atMoments"></div>

      <h3 class="at-sec t-label-md700">Durations</h3>
      <div class="at-rows" id="atSpans"></div>
    </main>
  </section>
