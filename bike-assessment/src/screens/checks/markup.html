  <!-- ====================================================================
       SERVICING CHECKS — ported from mechanic-checks/
       Barun's screen, reached from the RnM dashboard's Checks card.

       His phone frame, status bar and options sheet are gone: this app has one of
       each. His ⋮ carries data-opt-more so it opens the host's sheet.
       ==================================================================== -->
  <section class="screen" id="scrChecks" data-pos="right"
           aria-label="Servicing checks">


  <!-- ── App bar ──────────────────────────────────────────────────────────── -->
  <header class="appbar">
    <div class="appbar__row">
      <div class="appbar__lhs">
      <div class="leading-action">
        <button class="icon-btn" id="ckBackBtn" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M10.4538 12L14.5269 16.0731C14.6654 16.2116 14.7362 16.3856 14.7394 16.5952C14.7426 16.8048 14.6718 16.982 14.5269 17.1269C14.382 17.2718 14.2064 17.3442 14 17.3442C13.7936 17.3442 13.618 17.2718 13.4731 17.1269L8.97888 12.6327C8.88528 12.5391 8.81925 12.4404 8.7808 12.3365C8.74233 12.2327 8.7231 12.1205 8.7231 12C8.7231 11.8795 8.74233 11.7673 8.7808 11.6635C8.81925 11.5596 8.88528 11.4609 8.97888 11.3673L13.4731 6.8731C13.6116 6.73463 13.7856 6.6638 13.9952 6.6606C14.2048 6.65738 14.382 6.72822 14.5269 6.8731C14.6718 7.01797 14.7442 7.1936 14.7442 7.4C14.7442 7.6064 14.6718 7.78203 14.5269 7.9269L10.4538 12Z" fill="#222222"/></svg>
        </button>
      </div>
      <div class="appbar__titles">
        <p class="t-label-md">543210 <span class="appbar__suffix" aria-hidden="true">/ Periodic maintenance</span></p>
      </div>
      </div>
      <button class="icon-btn appbar__more" data-opt-more aria-label="More options"
              aria-haspopup="dialog" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 20C11.45 20 10.9792 19.8042 10.5875 19.4125C10.1958 19.0208 10 18.55 10 18C10 17.45 10.1958 16.9792 10.5875 16.5875C10.9792 16.1958 11.45 16 12 16C12.55 16 13.0208 16.1958 13.4125 16.5875C13.8042 16.9792 14 17.45 14 18C14 18.55 13.8042 19.0208 13.4125 19.4125C13.0208 19.8042 12.55 20 12 20ZM12 14C11.45 14 10.9792 13.8042 10.5875 13.4125C10.1958 13.0208 10 12.55 10 12C10 11.45 10.1958 10.9792 10.5875 10.5875C10.9792 10.1958 11.45 10 12 10C12.55 10 13.0208 10.1958 13.4125 10.5875C13.8042 10.9792 14 11.45 14 12C14 12.55 13.8042 13.0208 13.4125 13.4125C13.0208 13.8042 12.55 14 12 14ZM12 8C11.45 8 10.9792 7.80417 10.5875 7.4125C10.1958 7.02083 10 6.55 10 6C10 5.45 10.1958 4.97917 10.5875 4.5875C10.9792 4.19583 11.45 4 12 4C12.55 4 13.0208 4.19583 13.4125 4.5875C13.8042 4.97917 14 5.45 14 6C14 6.55 13.8042 7.02083 13.4125 7.4125C13.0208 7.80417 12.55 8 12 8Z" fill="currentColor"/></svg></button>
    </div>
  </header>

  <!-- ── Checklist ────────────────────────────────────────────────────────── -->
  <main class="ck-scroll" id="ckScroll">
    <!-- Section headers are rendered with the rows, so a new section is a data
         change rather than a markup one. -->
    <div class="ck-list" id="ckList"></div>
  </main>

  <!-- ── Progress ─────────────────────────────────────────────────────────── -->
  <div class="ck-progress"><div class="ck-progress__fill" id="ckProgressFill"></div></div>

  <!-- ── Tabs — one per checklist, built from the data ────────────────────── -->
  <div class="ck-tabs-wrap">
    <div class="ck-tabs" id="ckTabs" role="tablist" aria-label="Checklists">
      <span class="ck-tabs__underline" id="ckTabsUnderline"></span>
    </div>
  </div>

  <!-- ── Footer ───────────────────────────────────────────────────────────── -->
  <footer class="ck-footer">
    <div class="ck-footer__content ck-footer__content--end">
      <!-- Not shown until the checklist on screen has been judged through. There
           is no disabled state any more: a greyed-out button that sits there
           through the whole task is a permanent reminder of what you cannot do
           yet. The footer stays away and arrives as the reward for finishing.

           Its label is written by showFooter() — Next while another checklist is
           still owed, Done once none is. -->
      <button class="btn-primary t-label-md700" id="ckDoneBtn">Done</button>
    </div>
  </footer>

  <!-- ── Part sheet — marks a part faulty and edits any earlier call ─────── -->
  <div class="ck-scrim" id="ckScrim"></div>
  <section class="ck-sheet" id="ckSheet" role="dialog" aria-modal="true" aria-labelledby="sheetName">
    <div class="ck-sheet__top">
      <div class="ck-sheet__grabzone" id="ckSheetGrab"><div class="ck-sheet__grab"></div></div>
      <div class="ck-sheet__stack">
        <!-- No good/faulty toggle here any more. The sheet is reached by pressing
             Faulty, so the verdict is already given by the time it opens and the
             toggle only offered a way to contradict the press that opened it.
             Re-judging a part now happens where the judgement is made: reopen the
             card from the list and press again. -->
        <div class="ck-sheet__part">
          <div class="ck-sheet__lhs">
            <div class="ck-thumb" id="ckSheetThumb"></div>
            <p class="t-label-md ck-sheet__name" id="ckSheetName"></p>
          </div>
        </div>
        <div class="ck-sheet__collapse" id="ckSheetCollapse">
          <div class="ck-sheet__collapseInner">
            <div class="ck-sheet__collapseBody">
              <div class="ck-sheet__divider"></div>
              <div class="ck-sheet__issues" id="ckSheetIssues">
                <p class="t-label-md">Issues</p>
                <div class="ck-chips" id="ckIssueChips"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="ck-sheet__footer">
      <button class="btn-primary t-label-md700" id="ckSheetConfirm" disabled>Add issues</button>
    </div>
  </section>

  </section>
