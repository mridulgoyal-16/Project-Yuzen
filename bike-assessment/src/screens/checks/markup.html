  <!-- ── Checklist ────────────────────────────────────────────────────────── -->
  <main class="ck-scroll" id="ckScroll">
    <!-- Section headers are rendered with the rows, so a new section is a data
         change rather than a markup one. -->
    <div class="ck-list" id="ckList"></div>
  </main>

  <!-- ── Progress ─────────────────────────────────────────────────────────── -->
  <div class="ck-progress"><div class="ck-progress__fill" id="ckProgressFill"></div></div>

  <!-- ── Footer ───────────────────────────────────────────────────────────── -->
  <footer class="ck-footer">
    <div class="ck-footer__content ck-footer__content--end">
      <!-- Not shown until the checklist on screen has been judged through. There
           is no disabled state any more: a greyed-out button that sits there
           through the whole task is a permanent reminder of what you cannot do
           yet. The footer stays away and arrives as the reward for finishing.

           Its label is written by showFooter() — Next while another checklist is
           still owed, Done once none is. -->
      <button class="btn-primary t-label-md700" id="ckDoneBtn">Done</button>
    </div>
  </footer>

  <!-- ── Part sheet — marks a part faulty and edits any earlier call ─────── -->
  <div class="ck-scrim" id="ckScrim"></div>
  <section class="ck-sheet" id="ckSheet" role="dialog" aria-modal="true" aria-labelledby="sheetName">
    <div class="ck-sheet__top">
      <div class="ck-sheet__grabzone" id="ckSheetGrab"><div class="ck-sheet__grab"></div></div>
      <div class="ck-sheet__stack">
        <!-- No good/faulty toggle here any more. The sheet is reached by pressing
             Faulty, so the verdict is already given by the time it opens and the
             toggle only offered a way to contradict the press that opened it.
             Re-judging a part now happens where the judgement is made: reopen the
             card from the list and press again. -->
        <div class="ck-sheet__part">
          <div class="ck-sheet__lhs">
            <div class="ck-thumb" id="ckSheetThumb"></div>
            <p class="t-label-md ck-sheet__name" id="ckSheetName"></p>
          </div>
        </div>
        <div class="ck-sheet__collapse" id="ckSheetCollapse">
          <div class="ck-sheet__collapseInner">
            <div class="ck-sheet__collapseBody">
              <div class="ck-sheet__divider"></div>
              <div class="ck-sheet__issues" id="ckSheetIssues">
                <p class="t-label-md">Issues</p>
                <div class="ck-chips" id="ckIssueChips"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="ck-sheet__footer">
      <button class="btn-primary t-label-md700" id="ckSheetConfirm" disabled>Add issues</button>
    </div>
  </section>

  </section>
