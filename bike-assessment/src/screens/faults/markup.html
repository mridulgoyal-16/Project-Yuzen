    <!-- The other half of the same strip — see shared/steptabs.js. -->
    <nav class="steptabs" id="faultsTabs" role="tablist" aria-label="Assessment"></nav>

    <section class="carousel" id="carousel" aria-hidden="true" aria-label="Customer's photos">
      <div class="carousel__inner">
        <div class="track" id="track"></div>
        <div class="carousel__scrim"></div>
        <div class="carousel__label t-label-xs">Customer&rsquo;s photos</div>
        <div class="dots" id="dots"></div>
      </div>
    </section>

    <main class="fscroll" id="fscroll">
      <div class="listhead" id="faultsHead">
        <h2 class="t-title-page">Mark penalties</h2>
      </div>
      <div class="flist" id="flist"></div>
    </main>

    <div class="fempty" id="fempty" hidden>
      <p class="t-label-md700">Assessment pending</p>
      <p class="t-body-sm">Penalty options appear here for the faults you mark.</p>
    </div>

    <!-- The step CTA. It is NOT the Done button that used to stand here: that
         one said "Done", closed nothing and went where the back arrow already
         went. This one names the next step of the assessment and goes there —
         see RnM.nextStepLabel in screens/rnm/script.js — and it only appears once
         every fault on screen has a penalty against it, because until then the
         thing it is offering to move on from is not finished. -->
    <div class="ffooter" id="ffooter">
      <div class="stepbanner" id="faultsBanner" hidden></div>
      <button class="btn-primary t-label-md700" id="faultsNext"><span>Next</span></button>
    </div>
  </section>
