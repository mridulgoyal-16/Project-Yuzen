  <!-- ══════════════════════════════════════════════════════════════════════
       ACTIVE CHECKLISTS — which checklists this assessment runs
       ══════════════════════════════════════════════════════════════════════
       Not the same page as the Assessment checklist (screens/assess), and the
       split is deliberate: that one is the parts themselves, swiped one at a
       time; this one is which lists of parts are in play. Both used to hang off
       the same route — the dashboard's Active checklist ROW and its Assessment
       checklist BUTTON both opened the carousel — so the row had nowhere of its
       own to go. It has one now; the button is untouched.
       ══════════════════════════════════════════════════════════════════════ -->
  <section class="screen screen--checklists" id="scrChecklists" data-pos="right" aria-label="Active checklists">

    <header class="appbar">
      <div class="appbar__row">
        <div class="appbar__lhs">
          <div class="leading-action">
            <button class="icon-btn" id="clBack" aria-label="Back to assessment">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M10.4538 12L14.5269 16.0731C14.6654 16.2116 14.7362 16.3856 14.7394 16.5952C14.7426 16.8048 14.6718 16.982 14.5269 17.1269C14.382 17.2718 14.2064 17.3442 14 17.3442C13.7936 17.3442 13.618 17.2718 13.4731 17.1269L8.97888 12.6327C8.88528 12.5391 8.81925 12.4404 8.7808 12.3365C8.74233 12.2327 8.7231 12.1205 8.7231 12C8.7231 11.8795 8.74233 11.7673 8.7808 11.6635C8.81925 11.5596 8.88528 11.4609 8.97888 11.3673L13.4731 6.8731C13.6116 6.73463 13.7856 6.6638 13.9952 6.6606C14.2048 6.65738 14.382 6.72822 14.5269 6.8731C14.6718 7.01797 14.7442 7.1936 14.7442 7.4C14.7442 7.6064 14.6718 7.78203 14.5269 7.9269L10.4538 12Z" fill="#222222"/></svg>
            </button>
          </div>
          <div class="appbar__titles">
            <p class="t-label-md"><span data-bike-id>543210</span><span class="appbar__suffix" aria-hidden="true">&nbsp;/ Active checklists</span></p>
          </div>
        </div>
        <!-- No ⋮. Every option the sheet offers on this flow is about the bike or
             the job, and this page is neither — it is one question with one
             answer control per row. A menu here would be a button that can only
             take you somewhere else. -->
      </div>
    </header>

    <main class="clscroll" id="clScroll">
      <div class="listhead">
        <h2 class="t-title-page">Active checklists</h2>
        <!-- What the page is FOR, which the heading alone does not say: two of
             these are already running and cannot be turned off, so without this
             the first thing a QCA meets is two locked rows and no reason for
             the page to exist. -->
        <p class="t-label-sm clsub">Assign additional checklists if required.</p>
      </div>
      <div class="cllist" id="clList"></div>
    </main>

    <!-- Two buttons, stacked, one of which is usually absent. The PRIMARY is
         this flow's step CTA: it names the next outstanding step, or says
         Assessment done. UPDATE grows in BELOW it the moment the selection
         differs from what is saved — and while it is there the primary is
         disabled, because moving on from an uncommitted edit would be moving on
         from a decision nobody took.

         Primary on top, secondary under it, which is the arrangement the fault
         record's footer already uses. It read the other way round for one build,
         and two screens in the same flow disagreeing about where the way forward
         lives is worse than either order.

         Update is wrapped in a collapsing row rather than simply hidden: a
         button that arrives has to push the footer open, and `hidden` cannot be
         animated. See .clfoot__slot in style.css. -->
    <div class="clfoot" id="clFoot">
      <div class="stepbanner" id="clBanner" hidden></div>
      <button class="btn-primary t-label-md700" id="clNext"><span>Next</span></button>
      <div class="clfoot__slot">
        <div>
          <button class="btn-secondary t-label-md700" id="clUpdate"><span>Update</span></button>
        </div>
      </div>
    </div>
  </section>
