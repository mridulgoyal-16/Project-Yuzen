        <!-- The PROFILE, not the words "Shift status". The row is the way to the
             profile picker and the only place on Home that says which one is
             selected — and which profile you are is the thing that decides what
             every block below it shows. The On Duty tag beside it still carries
             the shift. Written by paintHomeBlocks. -->
        <p class="t-label-md" id="hmRole">Sr. Mechanic</p>
        <span class="hm__tag t-label-xs">On Duty</span>
      </button>
      <div class="hm__gap"></div>

      <!-- PER ROLE. "My Tasks" is right over a Captain's tokens and a QCA's
           assessments, and wrong over the yard: the Sr. Mechanic's two blocks are
           a place, not a to-do list. So the heading is looked up rather than
           fixed — see HM_HEADING. -->
      <div class="hm__heading"><p class="t-label-md700" id="hmHeading">My Tasks</p></div>
      <div class="hm__tasks" id="hmTasks">
        <button class="hm__task" data-task="tokens"><img class="ic" src="assets/home/tokens.png" alt=""><span class="n t-label-md">36</span><span class="l t-label-sm">Active tokens</span></button>
        <button class="hm__task" data-task="dropped"><img class="ic" src="assets/home/dropped.png" alt=""><span class="n t-label-md">4</span><span class="l t-label-sm">Dropped bikes</span></button>
        <button class="hm__task" data-task="assessment"><img class="ic" src="assets/home/assess.png" alt=""><span class="n t-label-md">15</span><span class="l t-label-sm">Assessment & fault marking</span></button>
        <!-- REMOVED: the Assessment done card. It stood beside Assessment pending
             as the two halves of the QCA's day — until that queue grew a Transfer
             done tab of its own and said the same thing one tap earlier. Sagar
             took it off.

             The LISTING is untouched and still routed as `assessdone`; nothing
             opens it now. Restoring is this button plus the id back in
             HM_FOR_ROLE:

               <button class="hm__task" data-task="assessdone"><img class="ic" src="assets/home/task-placeholder.png" alt=""><span class="n t-label-md">7</span><span class="l t-label-sm">Assessment done</span></button>

             Worth knowing before it goes for good: the bikes that are assessed
             but not yet transferred appear ONLY on that listing. The pending
             queue's two tabs cover the other two states. -->
        <button class="hm__task" data-task="repairable"><img class="ic" src="assets/home/repair.png" alt=""><span class="n t-label-md">12</span><span class="l t-label-sm">Repair tasks</span></button>
        <!-- The Sr. Mechanic's TWO blocks. They were one for a build — both
             halves of the yard under two tabs — and they are two again, because
             they are two different jobs rather than two views of one number:
             Unallocated bikes is a decision queue (pick a bike, pick a mechanic)
             and Allocated bikes is a board you watch. Under one strip the second
             read as another place to allocate from.

             The Allocated block carries the Waiting / On-going split as two
             accordions on one scroll.

             Placeholder thumbnails, the generic image mark, so they read as "art
             pending" rather than as a render nobody looked at. -->
        <button class="hm__task" data-task="allocation"><img class="ic" src="assets/home/task-placeholder.png" alt=""><span class="n t-label-md">6</span><span class="l t-label-sm">Unallocated bikes</span></button>
        <button class="hm__task" data-task="allocated"><img class="ic" src="assets/home/task-placeholder.png" alt=""><span class="n t-label-md">27</span><span class="l t-label-sm">Allocated bikes</span></button>
        <!-- These two were appended in pipeline order — waiting to be assessed,
             repairable, waiting on QC, waiting to go out — back when one home
             showed all six. Role-gating ended that: no profile sees all six any
             more, so the pipeline never reads as a sequence.

             DOM order is unchanged, but the Quality Associate — the only profile
             shown both — gets them paired on their own row, under Bike assessment.
             The break is a CSS rule on the QC card, not a reordering here; see
             .hm__task[data-task="qc"] in this screen's stylesheet. -->
        <button class="hm__task" data-task="qc"><span class="n t-label-md">8</span><span class="l t-label-sm">QC pending</span></button>
        <button class="hm__task" data-task="rtd"><span class="n t-label-md">5</span><span class="l t-label-sm">RTD pending</span></button>
      </div>

      <div class="hm__heading" style="margin-top:36px">
        <p class="t-label-md700">Workbench shortcuts</p>
        <a class="t-label-md" id="hmViewAll">View all</a>
      </div>
      <!-- Six from Figma 2189:31118. The grey tile behind each icon is gone with
           them: that frame sets the icons straight on the surface, and the plate
           was only ever there to hold the flat 20px glyphs the plain variants
           used. Every one is now a render, so the variants are gone too. -->
      <div class="hm__shortcuts" id="hmShortcuts">
        <button class="hm__sc" data-sc="Commands"><i style="background-image:url(assets/home/sc-commands.png)"></i><span class="cap t-label-xs">Commands</span></button>
        <button class="hm__sc" data-sc="bike status"><i style="background-image:url(assets/home/sc-bike-status.png)"></i><span class="cap t-label-xs">bike status</span></button>
        <button class="hm__sc" data-sc="Spare card"><i style="background-image:url(assets/home/sc-spare-card.png)"></i><span class="cap t-label-xs">Spare card</span></button>
        <button class="hm__sc" data-sc="Warehouse tagging"><i style="background-image:url(assets/home/sc-warehouse.png)"></i><span class="cap t-label-xs">Warehouse tagging</span></button>
        <button class="hm__sc" data-sc="MRE BLE reset"><i style="background-image:url(assets/home/sc-ble-reset.png)"></i><span class="cap t-label-xs">MRE BLE reset</span></button>
        <button class="hm__sc" data-sc="Deploy battery on bike"><i style="background-image:url(assets/home/sc-deploy-battery.png)"></i><span class="cap t-label-xs">Deploy battery on bike</span></button>
      </div>
    </main>
