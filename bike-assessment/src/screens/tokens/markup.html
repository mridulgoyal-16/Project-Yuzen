       changes: a back button, because there is no bottom nav to leave by, and no
       status bar — the app owns one already.
       ══════════════════════════════════════════════════════════════════════ -->

          </button>
        </div>
        <h1 class="tqbar-title">My tasks</h1>
        <button class="btn-icon" type="button" aria-label="Search">
          <img src="assets/tokens/search.svg" alt="">
        </button>
      </div>

      <div class="tabs-wrap">
        <div class="tabs" id="tqTabs">
          <div class="tabs-underline" id="tqTabsUnderline"></div>
        </div>
      </div>
    </header>

    <main class="tqbody" id="tqBody"></main>
  </section>
