
  <!-- ====================================================================
       MARK ISSUES — ported from mechanic-rnm-flow/
       Vaishnavi's screen, Figma 2052:16043 / 2014:14800 / 2052:16205.

       Her device frame, status bar, toast and options sheet are gone: this app has
       one of each and a second copy is the drift her own README warns about. Her
       toast() calls now reach the host's.

       Every id carries an "mi" prefix and the classes that collided with this app
       carry "mi-". Renaming is done in class and id CONTEXTS only — a blanket word
       rename also caught JS identifiers and produced `function iq-toast()`.
       ==================================================================== -->
  <section class="screen" id="scrMarkIssues" data-pos="right" aria-label="Mark Issues">


  <header class="appbar">

  </header>

  <div class="mi-tabs-wrap">
    <div class="mi-tabs" id="miTabs" role="tablist" aria-label="Zone">
      <!-- The underline stays the last child; tabs are inserted before it. -->
      <div class="mi-tabs-underline" id="miTabsUnderline"></div>
    </div>
  </div>

  <main class="mi-scroll" id="miScroll">
    <div id="miPane"></div>
  </main>

  <!-- ── Options sheet, opened from the three dots ────────────────────────
       The same sheet as on issues and mechanic-checks — build.py lifts its CSS,
       so the three cannot drift. One item here: this screen has no counterpart
       to the issues screen's "Finish with open issues". -->
  
  

  <!-- ── Part sheet, opened from a Recommended tile ─────────────────────────
       Structure and styling are mechanic-checks' part sheet: build.py lifts its
       CSS, so the two are one sheet rather than two that resemble each other.
       What is missing is that screen's Faulty/Good toggle — see the README. -->
  
  <div class="scrim" id="miPartScrim"></div>
    <section class="mi-sheet" id="miPartSheet" role="dialog" aria-modal="true"
           aria-labelledby="partName">
    <div class="sheet__top">
      <div class="sheet__grabzone" id="miPartGrab"><div class="sheet__grab"></div></div>
      <div class="sheet__stack">
        <div class="sheet__part">
          <div class="sheet__lhs">
            <div class="thumb" id="miPartThumb"></div>
            <p class="t-label-md sheet__name" id="miPartName"></p>
          </div>
        </div>
        <div class="sheet__collapseBody">
          <div class="sheet__divider"></div>
          <div class="sheet__issues">
            <p class="t-label-md">Issues</p>
            <div class="mi-chips" id="miPartChips"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="sheet__footer">
      <!-- "Add issue" on a clean part, "Update issue" on one already filed —
           see paintSheet(). -->
      <button class="btn-primary t-label-md700" id="miPartConfirm" disabled>Confirm</button>
      <!-- Only against a part that already carries issues. Red and carrying a
           dustbin, the same treatment the Issues screen's detail sheet gives the
           same action: it throws the issue away rather than closing it. -->
      <button class="btn-primary t-label-md700 mi-btn-danger" id="miPartDelete" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.616 20q-.667 0-1.141-.475Q6 19.051 6 18.385V6h-.75q-.213 0-.356-.144Q4.75 5.713 4.75 5.5t.144-.356Q5.037 5 5.25 5H9q0-.213.144-.356Q9.287 4.5 9.5 4.5h5q.213 0 .356.144.144.143.144.356h3.75q.213 0 .356.144.144.143.144.356t-.144.356Q18.963 6 18.75 6H18v12.385q0 .666-.475 1.14-.474.475-1.14.475H7.616ZM17 6H7v12.385q0 .269.173.442.173.173.443.173h8.769q.269 0 .442-.173.173-.173.173-.442V6ZM9.808 17h1V8h-1v9Zm3.384 0h1V8h-1v9Z"/></svg>
        Delete
      </button>
    </div>
  </section>

  

  <footer class="mi-footer is-hidden" id="miFooter">
    <div class="footer__content footer__content--single">
      <button class="btn-block" id="miUpdateBtn">Update issues</button>
    </div>
  </footer>
  </section>
