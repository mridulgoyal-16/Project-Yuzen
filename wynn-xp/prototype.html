<title>Wynn XP — Vehicle Control</title>
<style>
  :root {
    --white: #ffffff;
    --ink-950: #14161b;
    --ink-900: #eef0f3;
    --ink-800: #e3e6ea;
    --line: rgba(14, 17, 22, 0.08);
    --text-hi: #14161b;
    --text-lo: #6b7280;
    --text-faint: #9aa1ac;
    --cyan: #2bb8f5;
    --cyan-dim: rgba(43, 184, 245, 0.16);
    --cyan-glow: rgba(43, 184, 245, 0.45);
    --green: #3ed598;
    --green-dim: rgba(62, 213, 152, 0.16);
    --red: #f45b5b;
    --red-dim: rgba(244, 91, 91, 0.16);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #101114;
    font-family: "Satoshi", -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  button { font-family: inherit; }

  button:focus-visible {
    outline: 2px solid var(--cyan);
    outline-offset: 2px;
  }

  .device {
    width: 390px;
    height: 844px;
    background: var(--white);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Hero stage ---------- */

  .hero {
    position: relative;
    height: 420px;
    flex-shrink: 0;
    background: var(--white);
    overflow: hidden;
  }

  .hero-topbar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 18px 0;
  }

  .icon-btn {
    width: 38px;
    height: 38px;
    border-radius: 999px;
    border: 1px solid rgba(14, 17, 22, 0.07);
    background: rgba(14, 17, 22, 0.05);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #14161b;
    cursor: pointer;
  }

  .topbar-group {
    display: flex;
    gap: 8px;
  }

  .rings-wrap {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-top: 36px;
  }

  .rings {
    position: relative;
    width: 300px;
    height: 300px;
  }

  .ring {
    position: absolute;
    inset: 0;
    border-radius: 999px;
    border: 1px solid rgba(43, 184, 245, 0.16);
    -webkit-mask-image: radial-gradient(circle, #000 62%, transparent 72%);
    mask-image: radial-gradient(circle, #000 62%, transparent 72%);
  }

  .ring.r2 { inset: 34px; border-color: rgba(43, 184, 245, 0.1); }

  .ticks {
    position: absolute;
    inset: -16px;
    border-radius: 999px;
    background: repeating-conic-gradient(
      rgba(43, 184, 245, 0.22) 0deg 1.2deg,
      transparent 1.2deg 30deg
    );
    -webkit-mask-image: radial-gradient(circle, transparent 96%, #000 97%, #000 100%, transparent 100%);
    mask-image: radial-gradient(circle, transparent 96%, #000 97%, #000 100%, transparent 100%);
  }

  .sweep {
    position: absolute;
    inset: 0;
    border-radius: 999px;
    background: conic-gradient(
      from 0deg,
      transparent 0deg,
      rgba(43, 184, 245, 0.55) 14deg,
      transparent 46deg
    );
    -webkit-mask-image: radial-gradient(circle, transparent 60%, #000 62%, #000 72%, transparent 74%);
    mask-image: radial-gradient(circle, transparent 60%, #000 62%, #000 72%, transparent 74%);
    opacity: 0;
    transition: opacity 0.4s ease;
    animation: spin 7s linear infinite;
  }

  .stage.powered .sweep { opacity: 1; }
  .stage.powered .ring { border-color: rgba(43, 184, 245, 0.32); }
  .stage.powered .ring.r2 { border-color: rgba(43, 184, 245, 0.2); }
  .stage.powered .ticks { background: repeating-conic-gradient(rgba(43, 184, 245, 0.4) 0deg 1.2deg, transparent 1.2deg 30deg); }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .media-wrap {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .media-frame {
    position: relative;
    width: 100%;
    height: 100%;
    transition: filter 0.5s ease;
  }

  .stage.powered .media-frame {
    filter: drop-shadow(0 6px 22px rgba(43, 184, 245, 0.35));
  }

  .media-frame video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 0;
    transition: opacity 0.12s ease;
  }

  .media-frame .active { opacity: 1; }

  /* ---------- Control sheet ---------- */

  .sheet {
    flex: 1;
    background: #f6f7f9;
    border-radius: 26px 26px 0 0;
    margin-top: -18px;
    position: relative;
    z-index: 2;
    padding: 20px 22px 16px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 -1px 0 rgba(14, 17, 22, 0.06);
  }

  .status-strip {
    display: flex;
    align-items: center;
    padding-bottom: 18px;
  }

  .status-item {
    display: flex;
    align-items: center;
    gap: 7px;
    color: var(--text-lo);
    padding-right: 16px;
  }

  .status-item .val {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-hi);
  }

  .status-divider {
    width: 1px;
    height: 16px;
    background: var(--line);
    margin-right: 16px;
  }

  .status-strip .expand {
    margin-left: auto;
    color: var(--text-faint);
    display: flex;
  }

  .hairline {
    height: 1px;
    background: var(--line);
  }

  /* ---------- Control grid ---------- */

  .ctrl-grid {
    display: flex;
    flex-direction: column;
    gap: 24px;
    padding: 22px 0 6px;
  }

  .ctrl-row {
    display: flex;
    justify-content: space-between;
  }

  .ctrl-row.start { justify-content: flex-start; }

  .ctrl-group {
    display: flex;
    gap: 14px;
  }

  .ctrl-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    background: none;
    border: 0;
    cursor: pointer;
    width: 64px;
  }

  .ctrl-btn .circle {
    width: 56px;
    height: 56px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--ink-900);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-lo);
    transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
  }

  .ctrl-btn .cap {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text-lo);
    letter-spacing: 0.01em;
    transition: color 0.2s ease;
  }

  .ctrl-btn.active .cap { color: var(--text-hi); }

  .ctrl-btn.active.cyan .circle {
    background: var(--cyan);
    border-color: var(--cyan);
    color: var(--ink-950);
    box-shadow: 0 0 0 6px var(--cyan-dim);
  }

  .ctrl-btn.active.green .circle {
    background: var(--green);
    border-color: var(--green);
    color: var(--ink-950);
    box-shadow: 0 0 0 6px var(--green-dim);
  }

  .ctrl-btn.active.red .circle {
    background: var(--red);
    border-color: var(--red);
    color: var(--ink-950);
    box-shadow: 0 0 0 6px var(--red-dim);
  }

  .ctrl-btn:disabled { cursor: default; }
  .ctrl-btn:disabled:not(.active) { opacity: 0.4; }

  /* ---------- Model bar ---------- */

  .model-bar {
    margin-top: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 16px;
    border-top: 1px solid var(--line);
  }

  .model-bar .name {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-hi);
    letter-spacing: 0.01em;
  }

  .model-bar button {
    background: none;
    border: 0;
    color: var(--text-lo);
    display: flex;
    cursor: pointer;
  }

  .home-indicator {
    width: 134px;
    height: 5px;
    border-radius: 999px;
    background: rgba(14, 17, 22, 0.18);
    margin: 14px auto 0;
  }

  @media (prefers-reduced-motion: reduce) {
    .sweep { animation: none; }
    .ctrl-btn .circle, .ctrl-btn .cap, .media-frame video, .media-frame {
      transition: none;
    }
  }
</style>

<div class="device">
  <div class="hero">
    <div class="stage" id="stage">
      <div class="rings-wrap">
        <div class="rings">
          <div class="ticks"></div>
          <div class="ring"></div>
          <div class="ring r2"></div>
          <div class="sweep"></div>
        </div>
      </div>
      <div class="media-wrap">
        <div class="media-frame">
          <video id="openVideo" class="active" muted playsinline preload="auto" src="videos/seat%20open1.mp4"></video>
          <video id="closeVideo" muted playsinline preload="auto" src="videos/seat%20open1%20reversed.mp4"></video>
          <video id="powerOnVideo" muted playsinline preload="auto" src="videos/power%20ON.mp4"></video>
          <video id="powerOffVideo" muted playsinline preload="auto" src="videos/Power%20Off.mp4"></video>
        </div>
      </div>
    </div>

    <div class="hero-topbar">
      <button class="icon-btn" aria-label="Back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="topbar-group">
        <button class="icon-btn" aria-label="Vehicle info">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><circle cx="12" cy="8" r="0.6" fill="currentColor" stroke="none"/></svg>
        </button>
        <button class="icon-btn" aria-label="More options">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div class="sheet">
    <div class="status-strip">
      <div class="status-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="17" height="10" rx="2"/><path d="M19 10v4" stroke-width="2.4"/></svg>
        <span class="val">75%</span>
      </div>
      <div class="status-divider"></div>
      <div class="status-item" aria-label="Signal connected">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11a12 12 0 0 1 16 0"/><path d="M7.5 14.5a7 7 0 0 1 9 0"/><path d="M11 18a2 2 0 0 1 2 0"/></svg>
      </div>
      <div class="status-divider"></div>
      <div class="status-item" aria-label="Bluetooth connected">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5L17.5 17.5L12 23V1L17.5 6.5L6.5 17.5"/></svg>
      </div>
      <button class="expand" aria-label="View all vehicle status">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>

    <div class="hairline"></div>

    <div class="ctrl-grid">
      <div class="ctrl-row">
        <div class="ctrl-group">
          <button class="ctrl-btn red active" id="btnPowerOff">
            <span class="circle">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v8"/><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/></svg>
            </span>
            <span class="cap">Off</span>
          </button>
          <button class="ctrl-btn green" id="btnPowerOn">
            <span class="circle">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v8"/><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/></svg>
            </span>
            <span class="cap">On</span>
          </button>
        </div>
        <div class="ctrl-group">
          <button class="ctrl-btn cyan" id="btnUnlock">
            <span class="circle">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>
            </span>
            <span class="cap">Unlock</span>
          </button>
          <button class="ctrl-btn cyan active" id="btnLock">
            <span class="circle">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <span class="cap">Lock</span>
          </button>
        </div>
      </div>

      <div class="ctrl-row start">
        <div class="ctrl-group">
          <button class="ctrl-btn cyan" id="btnSeatOpen">
            <span class="circle">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17c0-2.2 1.8-4 4-4h8c2.2 0 4 1.8 4 4"/><path d="M12 13V7"/><path d="M9 10l3-3 3 3"/></svg>
            </span>
            <span class="cap">Open</span>
          </button>
          <button class="ctrl-btn cyan active" id="btnSeatClose">
            <span class="circle">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16c0-2.2 1.8-4 4-4h8c2.2 0 4 1.8 4 4"/><path d="M12 12V9"/><path d="M9 11l3 3 3-3"/></svg>
            </span>
            <span class="cap">Close</span>
          </button>
        </div>
      </div>
    </div>

    <div class="model-bar">
      <span class="name">Wynn XP · Dex 500/100</span>
      <button aria-label="Expand model details">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </div>

    <div class="home-indicator"></div>
  </div>
</div>

<script>
  const stage = document.getElementById('stage');

  const openVideo = document.getElementById('openVideo');
  const closeVideo = document.getElementById('closeVideo');
  const powerOnVideo = document.getElementById('powerOnVideo');
  const powerOffVideo = document.getElementById('powerOffVideo');
  const allVideos = [openVideo, closeVideo, powerOnVideo, powerOffVideo];

  function playClip(video) {
    // Seek while still hidden and wait for the frame to actually land before
    // fading it in, otherwise the crossfade can catch a blank/white frame.
    const reveal = () => {
      video.classList.add('active');
      allVideos.forEach((v) => { if (v !== video) v.classList.remove('active'); });
      video.play();
    };
    if (video.currentTime === 0) {
      reveal();
    } else {
      video.addEventListener('seeked', function onSeeked() {
        video.removeEventListener('seeked', onSeeked);
        reveal();
      }, { once: true });
      video.currentTime = 0;
    }
  }

  // Prime each decoder so the first tap doesn't pay a cold-start penalty.
  allVideos.forEach((video) => {
    const warmUp = () => {
      video.play().then(() => {
        video.pause();
        video.currentTime = 0;
      }).catch(() => {});
      video.removeEventListener('loadeddata', warmUp);
    };
    if (video.readyState >= 2) warmUp();
    else video.addEventListener('loadeddata', warmUp);
  });

  // ---------- Lock ----------
  const btnLock = document.getElementById('btnLock');
  const btnUnlock = document.getElementById('btnUnlock');

  function setLock(locked) {
    btnLock.classList.toggle('active', locked);
    btnUnlock.classList.toggle('active', !locked);
  }

  btnLock.addEventListener('click', () => setLock(true));
  btnUnlock.addEventListener('click', () => setLock(false));

  // ---------- Power (video crossfade) ----------
  const btnPowerOn = document.getElementById('btnPowerOn');
  const btnPowerOff = document.getElementById('btnPowerOff');

  let powerState = 'off';
  let powerBusy = false;

  function refreshPowerAvailability() {
    btnPowerOff.disabled = powerBusy;
    btnPowerOn.disabled = powerBusy || seatState === 'open';
  }

  function onPowerEnded() {
    powerBusy = false;
    refreshPowerAvailability();
  }

  powerOnVideo.addEventListener('ended', onPowerEnded);
  powerOffVideo.addEventListener('ended', onPowerEnded);

  btnPowerOn.addEventListener('click', () => {
    if (powerBusy || seatState === 'open' || powerState === 'on') return;
    powerState = 'on';
    powerBusy = true;
    btnPowerOn.classList.add('active');
    btnPowerOff.classList.remove('active');
    stage.classList.add('powered');
    refreshPowerAvailability();
    playClip(powerOnVideo);
  });

  function triggerPowerOff() {
    if (powerBusy || powerState === 'off') return;
    powerState = 'off';
    powerBusy = true;
    btnPowerOff.classList.add('active');
    btnPowerOn.classList.remove('active');
    stage.classList.remove('powered');
    refreshPowerAvailability();
    playClip(powerOffVideo);
  }

  btnPowerOff.addEventListener('click', triggerPowerOff);

  // ---------- Seat (video crossfade) ----------
  const btnSeatOpen = document.getElementById('btnSeatOpen');
  const btnSeatClose = document.getElementById('btnSeatClose');

  let seatState = 'closed';
  let seatBusy = false;

  function onSeatEnded() {
    seatBusy = false;
    btnSeatOpen.disabled = false;
    btnSeatClose.disabled = false;
    if (seatState === 'open') triggerPowerOff();
  }

  openVideo.addEventListener('ended', onSeatEnded);
  closeVideo.addEventListener('ended', onSeatEnded);

  btnSeatOpen.addEventListener('click', () => {
    if (seatBusy || seatState === 'open') return;
    seatState = 'open';
    seatBusy = true;
    btnSeatOpen.classList.add('active');
    btnSeatClose.classList.remove('active');
    btnSeatOpen.disabled = true;
    btnSeatClose.disabled = true;
    refreshPowerAvailability();
    playClip(openVideo);
  });

  btnSeatClose.addEventListener('click', () => {
    if (seatBusy || seatState === 'closed') return;
    seatState = 'closed';
    seatBusy = true;
    btnSeatClose.classList.add('active');
    btnSeatOpen.classList.remove('active');
    btnSeatOpen.disabled = true;
    btnSeatClose.disabled = true;
    refreshPowerAvailability();
    playClip(closeVideo);
  });

  refreshPowerAvailability();
</script>
